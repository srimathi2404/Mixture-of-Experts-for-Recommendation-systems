# Model + training hyperparameters for the self-attention-expert MoSE model.
# These are SASRec-scale defaults (same values as RecBole's own SASRec.yaml)
# reused per-expert; tune after the first end-to-end run.

# --- Self-attention expert (per-expert SASRec-style encoder) ---
n_experts: 4
n_layers: 2
n_heads: 2
hidden_size: 64
inner_size: 256
hidden_dropout_prob: 0.5
attn_dropout_prob: 0.5
hidden_act: gelu
layer_norm_eps: 1e-12
initializer_range: 0.02

# Extra experiment #2 (positional encoding ablation) switch. Every expert's
# parameters (including its position-embedding table) always exist, so a
# checkpoint's shape never depends on this flag - only whether the position
# embedding is *added* to the item embedding during the forward pass.
# Override with: --override use_positional_embedding=false
use_positional_embedding: true

# --- MMoE gate ---
n_tasks: 2                     # task 1: next-item (recommendation), task 2: rating regression
task_loss_weights: [1.0, 1.0]  # tune the multi-task weighting here

# Extra experiment #6 (load-balancing-loss cross-check): auxiliary
# coefficient-of-variation^2 importance loss (Shazeer et al. 2017),
# architecture-agnostic, same formula Track A uses for the non-sequential
# MMoE setting. 0.0 disables it (default / core deliverable run).
load_balancing_coef: 0.0

# --- Training ---
train_batch_size: 256
eval_batch_size: 256
learning_rate: 0.001
epochs: 200
stopping_step: 10
loss_type: CE            # next-item loss; rating task uses MSE, combined via task_loss_weights

metrics: [Recall, NDCG]
topk: [10]
valid_metric: NDCG@10
